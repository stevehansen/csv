name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '9.0.x'

    - name: Build
      run: dotnet build Csv.sln --configuration Release

    - name: Test
      run: dotnet test Csv.sln --no-build --configuration Release
