name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Build
      run: dotnet build Csv/Csv.csproj --configuration Release

    - name: Test
      run: dotnet test Csv.Tests/Csv.Tests.csproj --configuration Release

  # net48 tests (the only coverage of the netstandard2.0 build) need Windows
  netstandard:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Test
      run: dotnet test Csv.Tests.NetStandard/Csv.Tests.NetStandard.csproj --configuration Release
